info:
  name: CrearProducto
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/productos"
  body:
    type: json
    data: |-
      {
        "nombre": "IPhone 18",
        "descripcion": "16GB",
        "precio": 20000.00,
        "stock": 5
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
